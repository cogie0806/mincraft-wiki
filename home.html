<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ファビコンの設定 -->
    <link rel="icon" href="cogie0806.jpg" type="image/jpeg">
    <title>cogie0806のマイクラwiki</title>
    <style>
        /* 全体の基本設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 50px;
            min-height: 100vh; /* 画面の縦幅いっぱいに広げる */

            /* 💡 背景画像の設定 */
            background-image: url("mc26.3.png"); /* 背景にしたい画像の名前 */
            background-size: cover;             /* 画面全体に画像をぴったり合わせる */
            background-position: center;        /* 画像の中心を画面の真ん中に合わせる */
            background-repeat: no-repeat;       /* 画像が縦横にループするのを防ぐ */
            background-attachment: fixed;       /* スクロールしても背景画像を固定する */
        }

        /* タイトル部分 */
        h1 {
            font-size: 26px;
            color: #ffffff; /* 画像の上で見えやすいように白文字に変更 */
            margin-bottom: 40px;
            /* 文字の後ろに薄い影をつけて、明るい画像でも文字を読みやすくします */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); 
        }

        /* 💡 リンクボタンの共通デザイン */
        .link-btn {
            display: block;
            width: 80%;
            max-width: 500px;
            text-align: center;
            color: white;
            text-decoration: none; 
            padding: 15px 10px;
            margin: 20px auto;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        /* 🤖 ホームページ＆ダウンロード用の青いボタン設定 */
        .ai-btn {
            background-color: #0044ff; /* 鮮やかな青色 */
        }
        
        .ai-btn:hover {
            background-color: #0022cc; /* マウスを乗せたら少し濃い青に */
            transform: translateY(-2px); /* 少しだけ上に浮き上がる変化 */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
  
    <h1>cogie0806マイクラwikiへようこそ!</h1>
    
    <!-- ホームページを開くボタン -->
    <a id="link-home" class="link-btn ai-btn" href="https://cogie0806.github.io">cogie0806のホームページを開く</a>
    
    <!-- リソースパックをダウンロードするボタン -->
    <a id="link-download" class="link-btn ai-btn" href="https://cogie0806.github.io/minecraftwiki/repack01.html">cogie0806のマイクラリソースパックをダウンロード</a>

</body>
</html>
