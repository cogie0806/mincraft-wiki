<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ファビコン -->
    <link rel="icon" href="cogie0806.jpg" type="image/jpeg">
    <title>リソースパック配布ページ - cogie0806マイクラwiki</title>
    <style>
        /* 全体の基本設定 */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 15px;
            min-height: 100vh;
            box-sizing: border-box;
            color: #ffffff;

            /* 背景画像 */
            background-image: url("mc26.3.png"); 
            background-size: cover;             
            background-position: center;        
            background-repeat: no-repeat;       
            background-attachment: fixed;       
        }

        /* コンテンツを囲む半透明の黒いボックス */
        .container {
            background-color: rgba(0, 0, 0, 0.75);
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #444;
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #ffb74d; /* マイクラ風のオレンジ・ゴールド色 */
            text-shadow: 1px 1px 2px #000;
        }

        p {
            font-size: 15px;
            line-height: 1.8;
            color: #e0e0e0;
            text-align: left;
            max-width: 500px;
            margin: 20px auto;
        }

        /* 📋 情報テーブル */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 14px;
        }

        .info-table th, .info-table td {
            border: 1px solid #555;
            padding: 12px;
            text-align: left;
        }

        .info-table th {
            background-color: #222;
            color: #ffb74d;
            width: 30%;
        }

        .info-table td {
            background-color: #333;
        }

        /* 🔗 💡 ホームページの形をベースにした「青いボタン」デザイン */
        .link-btn {
            display: block;
            text-align: center;
            background-color: #3b82f6; /* 前回の自作コードで使われていた綺麗な青色 */
            color: white;
            text-decoration: none; 
            padding: 8px;              /* ホームページと同じスッキリした高さ */
            margin: 12px auto;         /* ボタン同士の間隔を少しだけ調整 */
            border-radius: 4px;        /* ホームページと同じ角丸具合 */
            font-size: 14px;           /* ホームページと同じ文字サイズ */
            width: 100%;               /* ボックスの幅いっぱいに広げる */
            box-sizing: border-box;
            border: none;              /* 枠線なし */
            transition: background-color 0.2s;
        }

        /* 青いボタンのホバー効果 */
        .link-btn:hover {
            background-color: #2563eb; /* 触れたときに少し濃い青色に */
        }

        /* 📱 スマホ用の調整 */
        @media (max-width: 500px) {
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 20px;
            }
            p, .info-table {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>cogie0806のマイクラリソースパック</h1>

        <p>
            <strong>【禁止行為】</strong><br>
            ・許可のない再配布<br>
            ・自作発言<br><br>
            動画や配信での使用は、許可なく自由に使っていただいて構いません！（チャンネル登録や概要欄へのURL記載をしてくれると嬉しいです）
        </p>

        <!-- リソースパックの詳細情報テーブル -->
        <table class="info-table">
            <tr>
                <th>パック名</th>
                <td>cogie0806-MC-reso.zip</td>
            </tr>
            <tr>
                <th>対応環境</th>
                <td>Java版 1.21.8 〜 26.3</td>
            </tr>
            <tr>
                <th>ファイル形式</th>
                <td>ZIP形式</td>
            </tr>
        </table>

        <!-- ダウンロードボタン（ホームページの形×青） -->
        <a href="cogie0806-MC-reso.zip" download class="link-btn">📥 リソースパックをダウンロード</a>

        <!-- ホームページを開くボタン（ホームページの形×青） -->
        <a id="link-home" class="link-btn" href="https://github.io">🏠 cogie0806のホームページを開く</a>

        <!-- 💡 wikiのトップページへ戻る（テキストリンクから青いボタンに変更！） -->
        <a href="index.html" class="link-btn">↩️ wikiのトップページへ戻る</a>
    </div>

</body>
</html>
